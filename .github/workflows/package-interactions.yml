name: Build and exercise PR packages

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact pull request source to build; does not publish a release
        required: true
        type: string

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-24.04
            recipe: packaging/build-deb.Dockerfile
          - target: debian-13
            recipe: packaging/build-debian.Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Require a disposable hosted VM
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -p reports
          git rev-parse HEAD > reports/source-commit.txt
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        id: builder
        with:
          context: packaging
          file: ${{ matrix.recipe }}
          load: true
          pull: true
          tags: licasa-package-ci:${{ matrix.target }}
          cache-from: type=gha,scope=package-ci-${{ matrix.target }}
          cache-to: type=gha,scope=package-ci-${{ matrix.target }},mode=min,ignore-error=true
      - name: Restore only exact native dependency outputs
        id: dependencies
        uses: actions/cache@v5
        with:
          path: build/ci-package-dependencies/${{ matrix.target }}
          key: package-ci-deps-v1-${{ matrix.target }}-${{ runner.arch }}-${{ steps.builder.outputs.imageid }}-${{ hashFiles('packaging/*.lock.json', 'packaging/patches/**', 'packaging/qt-runtime-modules.json', 'packaging/verify-fresh-build.sh', 'tools/build_codecs.py', 'tools/build_qt_backport.py', 'tools/build_qt_ffmpeg.py', 'tools/build_ubuntu_deb.py', 'tools/build_debian_deb.py', 'tools/build_ci_packages.py', 'tools/source_cache.py', 'tools/runtime_profiles.py', 'tools/qt_runtime.py', 'cmake/strip_codec_rpath.cmake', 'cmake/LicasaRuntimeProfiles.cmake') }}
      - name: Build and test actual packages without release preflight
        env:
          TARGET: ${{ matrix.target }}
          REUSE: ${{ steps.dependencies.outputs.cache-hit }}
        run: |
          set -o pipefail
          reuse=()
          if [ "$REUSE" = true ]; then reuse=(--reuse-dependencies); fi
          python3 tools/build_ci_packages.py --target "$TARGET" --image "licasa-package-ci:$TARGET" \
            --output "build/pr-packages/$TARGET" --dependencies "build/ci-package-dependencies/$TARGET" \
            --jobs 3 "${reuse[@]}" 2>&1 | tee reports/build.log
      - name: Exercise package installation, fallback and desktop interaction contracts
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="$(sed -nE '/^[[:space:]]*VERSION [0-9]+\.[0-9]+\.[0-9]+/s/^[[:space:]]*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          directory="build/pr-packages/$TARGET"
          mkdir -p reports
          case "$TARGET" in
            ubuntu-24.04)
              package="$directory/licasa_${version}-1_amd64.deb"
              appimage="$directory/Licasa-${version}-x86_64.AppImage"
              python3 tools/verify_deb_container.py "$package" --target ubuntu-24.04 --output reports/native.json
              python3 tools/check_package_report.py --target ubuntu24-native --package "$package" --report reports/native.json
              python3 tools/verify_appimage_container.py "$appimage" --target debian-13 --output reports/trixie.json
              python3 tools/check_package_report.py --target debian13-appimage --package "$appimage" --report reports/trixie.json
              python3 tools/verify_mate_accessibility_container.py "$appimage" --output reports/accessibility.json
              python3 tools/check_package_report.py --target debian13-mate-accessibility --package "$appimage" --report reports/accessibility.json
              ;;
            debian-13)
              package="$directory/licasa_${version}-1+deb13_amd64.deb"
              python3 tools/verify_deb_container.py "$package" --target debian-13 --output reports/native.json
              python3 tools/check_package_report.py --target debian13-native --package "$package" --report reports/native.json
              python3 tools/verify_native_dialog_container.py "$package" --target debian-13 --output reports/gtk.json
              python3 tools/check_package_report.py --target debian13-native-gtk --package "$package" --report reports/gtk.json
              ;;
          esac
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr-package-interactions-${{ matrix.target }}
          path: |
            reports/
            build/pr-packages/${{ matrix.target }}/*.json
            build/pr-packages/${{ matrix.target }}/qt-runtime-memory/
          retention-days: 14
          if-no-files-found: error
