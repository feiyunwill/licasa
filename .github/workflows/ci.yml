name: Build and verify
on:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_candidate:
        description: Build and qualify all package targets without publishing
        required: false
        type: boolean
        default: false
      expected_sha:
        description: Full source commit required for complete candidate verification
        required: false
        type: string
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit to verify
        required: true
        type: string
      presets:
        description: JSON array of CMake presets to verify
        required: false
        type: string
        default: '["release","asan","ubsan"]'

permissions:
  contents: read

# Superseded PR checks are disposable; release callers must finish their gates.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Check package contracts and qualification regressions
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil python3-gi gir1.2-glib-2.0 patchelf gcc
          python3 tools/check_support_manifest.py
          /usr/bin/python3 -B -m unittest discover -s tests -p 'test_*.py' -v

  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.scope.outputs.build }}
      packages: ${{ steps.scope.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Detect documentation-only pull requests
        id: scope
        run: |
          git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/changed-files"
          python3 - "$RUNNER_TEMP/changed-files" "$GITHUB_OUTPUT" <<'PY'
          from pathlib import Path
          import sys
          paths = Path(sys.argv[1]).read_bytes().split(b'\0')
          build = any(path and not (path.endswith(b'.md') or path == b'LICENSE') for path in paths)
          packages = any(path and not path.endswith(b'.md') and (
              path.startswith((b'src/', b'qml/', b'cmake/', b'packaging/', b'snap/', b'tools/', b'tests/',
                               b'.github/workflows/', b'assets/icons/'))
              or path in (b'CMakeLists.txt', b'CMakePresets.json', b'assets/licasa.png')) for path in paths)
          with open(sys.argv[2], 'a') as output:
              output.write(f"build={str(build).lower()}\n")
              output.write(f"packages={str(packages).lower()}\n")
          PY

  package_interactions:
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.packages == 'true'
    uses: ./.github/workflows/package-interactions.yml
    with:
      source_ref: ${{ github.sha }}

  test:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result == 'skipped' || needs.scope.outputs.build == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        preset: ${{ fromJSON(inputs.presets || (github.event_name == 'pull_request' && '["release"]' || '["release","asan","ubsan"]')) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates git cmake make ninja-build g++ python3 ccache \
            pkg-config patch meson nasm clang-format-18 binutils libjpeg-turbo8-dev libtiff-dev libpng-dev libwebp-dev \
            libx11-dev libxext-dev \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-image-formats-plugins \
            qt6-base-private-dev qt6-declarative-private-dev qt6-shadertools-dev \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml qml6-module-qtqml-workerscript \
            qml6-module-qttest qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-dialogs qml6-module-qtquick-layouts qml6-module-qt-labs-folderlistmodel
      - name: Check first-party C++ formatting
        run: python3 tools/check_code_style.py
      - name: Fingerprint the installed dependency toolchain
        id: toolchain
        run: |
          digest="$(dpkg-query -W -f='${Package}=${Version}\n' | LC_ALL=C sort | sha256sum | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Restore exact private dependencies
        id: dependencies
        uses: actions/cache@v5
        with:
          path: |
            build/codecs/prefix
            build/deps/qt-backport-runtime
          # No fallback keys: release/ASan/UBSan and ABI revisions stay separate.
          key: native-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ steps.toolchain.outputs.digest }}-${{ hashFiles('packaging/*.lock.json', 'packaging/patches/**', 'tools/build_codecs.py', 'tools/build_qt_backport.py', 'tools/runtime_profiles.py', 'tools/qt_runtime.py', 'packaging/qt-runtime-modules.json', 'cmake/LicasaRuntimeProfiles.cmake', 'tools/source_cache.py', 'cmake/strip_codec_rpath.cmake', '.github/workflows/ci.yml') }}
      - name: Cache compiler outputs
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: native-ccache-v1-${{ runner.arch }}-${{ matrix.preset }}-${{ steps.toolchain.outputs.digest }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: native-ccache-v1-${{ runner.arch }}-${{ matrix.preset }}-${{ steps.toolchain.outputs.digest }}-
      - name: Configure bounded compiler caching
        run: |
          ccache --max-size=400M
          echo 'CMAKE_C_COMPILER_LAUNCHER=ccache' >> "$GITHUB_ENV"
          echo 'CMAKE_CXX_COMPILER_LAUNCHER=ccache' >> "$GITHUB_ENV"
      - name: Build the same-version Qt Quick cleanup backport
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: python3 tools/build_qt_backport.py --jobs "$(nproc)"
      - name: Build maintained native image codecs
        if: steps.dependencies.outputs.cache-hit != 'true'
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          case "$PRESET" in
            release) sanitizer=() ;;
            asan) sanitizer=(--sanitizer address) ;;
            ubsan) sanitizer=(--sanitizer undefined) ;;
          esac
          python3 tools/build_codecs.py --prefix "$PWD/build/codecs/prefix" "${sanitizer[@]}" --jobs "$(nproc)"
      - name: Configure the application and matching sanitizer tests
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DLICASA_ENABLE_HEIF=ON -DLICASA_ENABLE_JXL=ON -DLICASA_ENABLE_RAW=ON \
            -DLICASA_ENABLE_AVIF=ON -DLICASA_ENABLE_APNG=ON \
            -DCMAKE_PREFIX_PATH="$PWD/build/codecs/prefix" \
            -DLICASA_QT_QUICK_BACKPORT_LIBRARY="$PWD/build/deps/qt-backport-runtime/libQt6Quick.so.6.4.2"
      - run: cmake --build --preset ${{ matrix.preset }} --parallel "$(nproc)"
      - run: ctest --preset ${{ matrix.preset }}
      - name: Verify installed release
        if: matrix.preset == 'release'
        run: |
          cmake --install build/release --prefix "$RUNNER_TEMP/licasa-package"
          python3 tools/check_hardening.py "$RUNNER_TEMP/licasa-package/bin/licasa"
          python3 tools/verify_installed_release.py "$RUNNER_TEMP/licasa-package" \
            --output build/release/package-smoke.json
          QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/licasa-package/bin/licasa_diagnostics" \
            --formats tests/test-assets/formats/core-matrix/jpeg/full-hd-1920x1080.jpg \
            > build/release/runtime-formats.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-${{ matrix.preset }}
          retention-days: 7
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            build/${{ matrix.preset }}/runtime-formats.json
            build/${{ matrix.preset }}/package-smoke.json
            build/${{ matrix.preset }}/raw-viewer-behavior.json
            build/${{ matrix.preset }}/viewer-lifecycle.json

  candidate_verification:
    needs: [package_contract, test]
    if: github.event_name == 'workflow_dispatch' && inputs.verify_candidate
    uses: ./.github/workflows/verify-candidate.yml
    with:
      source_sha: ${{ github.sha }}
      expected_sha: ${{ inputs.expected_sha }}
