name: Build and qualify Linux packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: licasa-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check source, new version, stable grade, and notes
        id: version
        run: |
          version="$(python3 tools/check_release_version.py \
            --channel stable \
            --expected-sha "$GITHUB_SHA" --source-ref "$GITHUB_REF")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Require a new GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          status="$(curl --silent --show-error --retry 3 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          if [ "$status" != 404 ]; then
            echo "Expected no existing GitHub Release; API returned $status" >&2
            exit 1
          fi
      - name: Check installer regressions before building
        run: |
          python3 -B tests/test_appimage_installer.py -v
          python3 -B tests/test_appimage_packaging.py -v
          bash -n packaging/install-licasa-appimage.sh

  verify_sanitizers:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ github.sha }}
      presets: '["asan","ubsan"]'

  build_and_test:
    needs: [preflight, verify_sanitizers]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Require an ephemeral hosted VM
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: docker/setup-buildx-action@v3
      - name: Cache the Ubuntu build environment
        id: builder
        uses: docker/build-push-action@v7
        with:
          context: packaging
          file: packaging/build-deb.Dockerfile
          load: true
          pull: true
          tags: licasa-deb-builder:release
          cache-from: type=gha,scope=licasa-deb-builder
          cache-to: type=gha,scope=licasa-deb-builder,mode=min,ignore-error=true
      - name: Restore exact Ubuntu private dependencies
        id: dependencies
        uses: actions/cache/restore@v5
        with:
          path: |
            build/release-dependencies/codecs
            build/release-dependencies/quick
            build/release-dependencies/ffmpeg
          key: ubuntu-release-deps-v2-${{ runner.arch }}-${{ steps.builder.outputs.imageid }}-${{ hashFiles('packaging/*.lock.json', 'packaging/patches/**', 'tools/build_codecs.py', 'tools/build_qt_backport.py', 'tools/build_qt_ffmpeg.py', 'tools/build_ubuntu_deb.py', 'cmake/strip_codec_rpath.cmake', 'packaging/verify-fresh-build.sh') }}
      - name: Build and test from a clean Ubuntu 24.04 image
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          REUSE_DEPENDENCIES: ${{ steps.dependencies.outputs.cache-hit == 'true' }}
        run: |
          docker run --rm -v "$PWD:/source:ro" licasa-deb-builder:release \
            bash -c 'cd /source && python3 tools/check_code_style.py'
          mkdir -p build/qualification/deb build/qualification/appimage
          mkdir -p build/release-dependencies/{codecs,quick,ffmpeg}
          docker run --rm -e LICASA_MAX_JOBS=3 -e LICASA_REUSE_DEPENDENCIES="$REUSE_DEPENDENCIES" \
            -v "$PWD:/source:ro" -v "$PWD/build/qualification/deb:/output" \
            -v "$PWD/build/release-dependencies/codecs:/work/licasa/build/codecs/release-prefix" \
            -v "$PWD/build/release-dependencies/quick:/work/licasa/build/deps/qt-backport-runtime" \
            -v "$PWD/build/release-dependencies/ffmpeg:/work/licasa/build/deps/qt-ffmpeg-runtime-release" \
            licasa-deb-builder:release bash /source/packaging/verify-fresh-build.sh
          mv "build/qualification/deb/Licasa-${VERSION}-x86_64.AppImage" \
            "build/qualification/deb/Licasa-${VERSION}-x86_64.AppImage.sha256" \
            build/qualification/appimage/
          docker run --rm -e VERSION="$VERSION" -v "$PWD:/source:ro" \
            -v "$PWD/build/qualification/deb:/output:ro" \
            licasa-deb-builder:release bash -ec '
              dpkg-deb --extract "/output/licasa_${VERSION}-1_amd64.deb" /tmp/licasa-package
              python3 /source/tools/check_hardening.py /tmp/licasa-package/usr/bin/licasa'
      - name: Save verified private dependencies before package installation checks
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            build/release-dependencies/codecs
            build/release-dependencies/quick
            build/release-dependencies/ffmpeg
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Install deb on clean Ubuntu and decode samples
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: python3 tools/verify_deb_container.py "build/qualification/deb/licasa_${VERSION}-1_amd64.deb"
      - name: Verify AppImage on clean Ubuntu, Fedora, and Arch
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 tools/verify_appimage_container.py "build/qualification/appimage/Licasa-${VERSION}-x86_64.AppImage"
          python3 tools/verify_appimage_fedora.py "build/qualification/appimage/Licasa-${VERSION}-x86_64.AppImage"
          python3 tools/verify_appimage_desktops.py "build/qualification/appimage/Licasa-${VERSION}-x86_64.AppImage"
      - name: Build and install Fedora and Arch packages
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          appimage="build/qualification/appimage/Licasa-${VERSION}-x86_64.AppImage"
          python3 tools/package_rpm.py "$appimage"
          python3 tools/verify_rpm_container.py \
            "build/qualification/rpm/licasa-appimage-${VERSION}-1.fc44.x86_64.rpm"
          python3 tools/package_arch.py "$appimage"
          python3 tools/verify_arch_package.py \
            "build/qualification/arch/licasa-appimage-${VERSION}-1-x86_64.pkg.tar.zst"
      - name: Save checked packages and test reports
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cd build/qualification/deb
          sha256sum --check "licasa_${VERSION}-1_amd64.deb.sha256"
          test "$(dpkg-deb --field "licasa_${VERSION}-1_amd64.deb" Version)" = "${VERSION}-1"
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist/deb
          git rev-parse HEAD > dist/deb/source-commit.txt
          cp "build/qualification/deb/licasa_${VERSION}-1_amd64.deb" dist/deb/
          cp "build/qualification/deb/licasa_${VERSION}-1_amd64.deb.sha256" dist/deb/
          cp build/qualification/deb/install-smoke.json dist/deb/
          mkdir -p dist/appimage
          cp "build/qualification/appimage/Licasa-${VERSION}-x86_64.AppImage" dist/appimage/
          cp "build/qualification/appimage/Licasa-${VERSION}-x86_64.AppImage.sha256" dist/appimage/
          cp packaging/install-licasa-appimage.sh dist/appimage/
          (cd dist/appimage && sha256sum install-licasa-appimage.sh > install-licasa-appimage.sh.sha256)
          cp build/qualification/appimage/install-smoke.json dist/appimage/
          cp build/qualification/appimage/fedora-smoke.json dist/appimage/
          cp build/qualification/appimage/desktop-smoke.json dist/appimage/
          mkdir -p dist/rpm dist/arch
          cp "build/qualification/rpm/licasa-appimage-${VERSION}-1.fc44.x86_64.rpm" dist/rpm/
          cp "build/qualification/rpm/licasa-appimage-${VERSION}-1.fc44.x86_64.rpm.sha256" dist/rpm/
          cp build/qualification/rpm/install-smoke.json dist/rpm/
          cp "build/qualification/arch/licasa-appimage-${VERSION}-1-x86_64.pkg.tar.zst" dist/arch/
          cp "build/qualification/arch/licasa-appimage-${VERSION}-1-x86_64.pkg.tar.zst.sha256" dist/arch/
          cp build/qualification/arch/PKGBUILD dist/arch/
          cp build/qualification/arch/PKGBUILD.sha256 dist/arch/
          cp build/qualification/arch/install-smoke.json dist/arch/
      - uses: actions/upload-artifact@v7
        with:
          name: licasa-linux-amd64
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build_snap:
    # Repackage the exact Ubuntu payload after its full build/test/install gates.
    needs: [preflight, build_and_test]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require an ephemeral hosted VM
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/download-artifact@v8
        with:
          name: licasa-linux-amd64
          path: build/verified-linux
      - name: Prepare the verified same-run Debian payload
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          test "$(cat build/verified-linux/deb/source-commit.txt)" = "$GITHUB_SHA"
          (cd build/verified-linux/deb && sha256sum --check "licasa_${VERSION}-1_amd64.deb.sha256")
          mkdir -p snap-input
          cp "build/verified-linux/deb/licasa_${VERSION}-1_amd64.deb" snap-input/
          cp "build/verified-linux/deb/licasa_${VERSION}-1_amd64.deb.sha256" snap-input/
          cp build/verified-linux/deb/source-commit.txt snap-input/
      - name: Build Snap in GitHub Actions
        id: snapcraft
        uses: snapcore/action-build@v1
      - name: Install and test the built Snap
        env:
          SNAP_FILE: ${{ steps.snapcraft.outputs.snap }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          test -f "$SNAP_FILE"
          sudo snap set system experimental.user-daemons=false
          sudo snap install --dangerous "$SNAP_FILE"
          python3 tools/verify_snap_install.py --version "$VERSION" \
            --source-sha "$GITHUB_SHA" \
            --output build/qualification/snap-local-smoke.json
          mkdir -p dist/snap
          cp "$SNAP_FILE" "dist/snap/licasa_${VERSION}_amd64.snap"
          (cd dist/snap && sha256sum "licasa_${VERSION}_amd64.snap" \
            > "licasa_${VERSION}_amd64.snap.sha256")
          cp build/qualification/snap-local-smoke.json dist/snap/
      - uses: actions/upload-artifact@v7
        with:
          name: licasa-snap-amd64
          path: dist/snap/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  upload_snap_edge:
    needs: [preflight, build_snap, build_and_test]
    runs-on: ubuntu-24.04
    environment: snap-beta
    timeout-minutes: 45
    outputs:
      revision: ${{ steps.verify.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: licasa-snap-amd64
          path: dist/snap
      - name: Check the Snap artifact and Store credentials
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          test -n "$SNAPCRAFT_STORE_CREDENTIALS"
          (cd dist/snap && sha256sum --check "licasa_${VERSION}_amd64.snap.sha256")
      - name: Upload the checked Snap to edge
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          sudo snap install snapcraft --classic
          snapcraft upload "dist/snap/licasa_${VERSION}_amd64.snap" --release=edge
      - name: Verify the Store's edge revision
        id: verify
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          sudo snap set system experimental.user-daemons=false
          sudo snap install --channel=edge licasa
          for attempt in $(seq 1 10); do
            installed_version="$(snap list licasa | awk 'NR == 2 {print $2}')"
            source_file=/snap/licasa/current/usr/share/licasa/source-commit
            if [ "$installed_version" = "$VERSION" ] &&
               [ -f "$source_file" ] &&
               [ "$(cat "$source_file")" = "$GITHUB_SHA" ]; then
              break
            fi
            sleep 20
            sudo snap refresh --channel=edge licasa
          done
          python3 tools/verify_snap_install.py --version "$VERSION" \
            --source-sha "$GITHUB_SHA" \
            --output build/qualification/snap-edge-smoke.json
          revision="$(snap list licasa | awk 'NR == 2 {print $3}')"
          test "$revision" -gt 0
          expected="$(cut -d' ' -f1 "dist/snap/licasa_${VERSION}_amd64.snap.sha256")"
          actual="$(sudo sha256sum "/var/lib/snapd/snaps/licasa_${revision}.snap" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: licasa-store-snap-smoke
          path: build/qualification/snap-edge-smoke.json
          if-no-files-found: error

  github_prerelease:
    needs: [preflight, build_snap, build_and_test, upload_snap_edge]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: licasa-linux-amd64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: licasa-snap-amd64
          path: dist/snap
      - name: Recheck package versions and hashes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 tools/check_release_version.py \
            --channel stable --expected-sha "$GITHUB_SHA" --source-ref "$GITHUB_REF"
          (cd dist/deb && sha256sum --check "licasa_${VERSION}-1_amd64.deb.sha256")
          test "$(dpkg-deb --field "dist/deb/licasa_${VERSION}-1_amd64.deb" Version)" = "${VERSION}-1"
          (cd dist/appimage && sha256sum --check "Licasa-${VERSION}-x86_64.AppImage.sha256")
          (cd dist/appimage && sha256sum --check install-licasa-appimage.sh.sha256)
          (cd dist/rpm && sha256sum --check "licasa-appimage-${VERSION}-1.fc44.x86_64.rpm.sha256")
          (cd dist/arch && sha256sum --check "licasa-appimage-${VERSION}-1-x86_64.pkg.tar.zst.sha256")
          (cd dist/arch && sha256sum --check PKGBUILD.sha256)
          (cd dist/snap && sha256sum --check "licasa_${VERSION}_amd64.snap.sha256")
      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gh
      - name: Publish checked packages as a GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SNAP_REVISION: ${{ needs.upload_snap_edge.outputs.revision }}
        run: |
          {
            printf 'Preview release: the checked Snap is on Store edge as revision %s. Stable follows qualification.\n\n' "$SNAP_REVISION"
            cat "packaging/release-notes/$RELEASE_TAG.md"
            printf "\n### Package SHA-256 checksums\n\n\`\`\`text\n"
            cat "dist/deb/licasa_${VERSION}-1_amd64.deb.sha256"
            cat "dist/appimage/Licasa-${VERSION}-x86_64.AppImage.sha256"
            cat "dist/appimage/install-licasa-appimage.sh.sha256"
            cat "dist/rpm/licasa-appimage-${VERSION}-1.fc44.x86_64.rpm.sha256"
            cat "dist/arch/licasa-appimage-${VERSION}-1-x86_64.pkg.tar.zst.sha256"
            cat "dist/arch/PKGBUILD.sha256"
            cat "dist/snap/licasa_${VERSION}_amd64.snap.sha256"
            printf "\`\`\`\n"
            printf "\nSource commit: \`%s\`.\n" "$GITHUB_SHA"
          } > dist/release-notes.md
          gh release create "$RELEASE_TAG" \
            "dist/deb/licasa_${VERSION}-1_amd64.deb" \
            "dist/deb/licasa_${VERSION}-1_amd64.deb.sha256" \
            "dist/appimage/Licasa-${VERSION}-x86_64.AppImage" \
            "dist/appimage/Licasa-${VERSION}-x86_64.AppImage.sha256" \
            "dist/appimage/install-licasa-appimage.sh" \
            "dist/appimage/install-licasa-appimage.sh.sha256" \
            "dist/rpm/licasa-appimage-${VERSION}-1.fc44.x86_64.rpm" \
            "dist/rpm/licasa-appimage-${VERSION}-1.fc44.x86_64.rpm.sha256" \
            "dist/arch/licasa-appimage-${VERSION}-1-x86_64.pkg.tar.zst" \
            "dist/arch/licasa-appimage-${VERSION}-1-x86_64.pkg.tar.zst.sha256" \
            "dist/arch/PKGBUILD" \
            "dist/arch/PKGBUILD.sha256" \
            "dist/snap/licasa_${VERSION}_amd64.snap" \
            "dist/snap/licasa_${VERSION}_amd64.snap.sha256" \
            --target "$GITHUB_SHA" --title "Licasa $RELEASE_TAG" \
            --prerelease --latest=false --notes-file dist/release-notes.md
